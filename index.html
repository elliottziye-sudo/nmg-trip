<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.panel{background-color:var(--paper);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid var(--edge);box-shadow:var(--shadow)}

@media (prefers-color-scheme:dark){

 .leaflet-overlay-pane path{filter:brightness(1.45) saturate(.9)}
}

#side{position:fixed;top:12px;left:12px;bottom:12px;width:380px;z-index:1001;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
#grab{display:none}
#sideScroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 18px 22px}
#sideScroll::-webkit-scrollbar{display:none}
#appbar{position:sticky;top:0;z-index:5;height:48px;margin:0 -18px -48px;display:flex;align-items:center;justify-content:center;font:600 15px var(--serif);letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .3s var(--spring);background:var(--paper-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:.5px solid var(--hair)}
#appbar.show{opacity:1}
#hdr{padding:34px 2px 0}
.cap{font-size:11.5px;letter-spacing:.18em;color:var(--ink2)}
h1{font-family:var(--serif);font-size:31px;font-weight:700;letter-spacing:.04em;line-height:1.2;margin:10px 0 8px}
.sub{font-size:13px;color:var(--ink2);line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border-top:1px solid var(--ink);border-bottom:.5px solid var(--hair)}
.stats>div{padding:11px 2px 10px}
.stats>div+div{border-left:.5px solid var(--hair);padding-left:14px}
.stats b{display:block;font-family:var(--num);font-size:25px;font-weight:500;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.stats span{display:block;font-size:11.5px;color:var(--ink2);margin-top:4px;letter-spacing:.04em}

.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:9px;padding:2px;margin:18px 0 12px}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:7px;background:var(--paper-strong);box-shadow:0 1px 4px rgba(60,40,20,.14);transition:transform .45s var(--spring)}
.seg[data-i="1"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:transparent;font-size:13px;color:var(--ink2);padding:6px 0;cursor:pointer;letter-spacing:.06em}
.seg button.on{color:var(--ink);font-weight:600}
.pane{animation:paneIn .4s var(--spring)}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.day{position:relative;padding:14px 4px 12px 0;border-bottom:.5px solid var(--hair);cursor:pointer;outline:none;transition:background-color .25s ease;-webkit-tap-highlight-color:transparent;border-radius:0}
.day:first-child{border-top:.5px solid var(--hair)}
.day:hover{background-color:var(--fill)}
.day:focus-visible{box-shadow:inset 0 0 0 2px var(--c)}
.day.active{background-color:var(--fill)}
.day.active:before{content:"";position:absolute;left:-18px;top:0;bottom:0;width:3px;background:var(--c)}
.day .top{display:flex;align-items:baseline;gap:12px}
.num{width:36px;flex-shrink:0;font-family:var(--num);font-size:22px;line-height:1;color:var(--c);font-variant-numeric:lining-nums tabular-nums;text-align:left;padding-left:2px}
.ttl{flex:1;min-width:0}
.day h3{font-family:var(--serif);font-size:16px;font-weight:700;margin:0 0 3px;letter-spacing:.02em;line-height:1.35}
.day .rt{font-size:12px;color:var(--ink2);line-height:1.5}
.day .body{padding:6px 0 0 50px}
.day .drive{font-size:12.5px;color:var(--ink)}
.day ul{margin:4px 0 0;padding:0;list-style:none}
.day li{font-size:13px;color:var(--ink2);line-height:1.55;margin-top:1px;padding-left:12px;position:relative}
.day li:before{content:"";position:absolute;left:0;top:10px;width:5px;height:1px;background:var(--ink3)}
.day .htl{display:flex;align-items:baseline;gap:8px;margin:8px 0 0 50px;font-size:12.5px}
.htl .hk{font-family:var(--serif);font-weight:700;color:var(--c);flex-shrink:0}
.htl .hn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htl .hp{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sh{font:700 13px var(--serif);letter-spacing:.12em;color:var(--ink);margin:22px 2px 8px}
.note{font-size:12.5px;color:var(--ink2);line-height:1.7;padding:0 2px}

.bhd{font-size:11.5px;letter-spacing:.18em;color:var(--ink2);margin-top:4px}
.btot{font-family:var(--num);font-size:38px;font-weight:500;line-height:1.1;margin-top:4px;font-variant-numeric:lining-nums tabular-nums}
.btot span{font-family:var(--sans);font-size:12.5px;color:var(--ink2);margin-left:8px}
.bbar{display:flex;gap:2px;height:8px;margin-top:12px}
.bbar i{display:block;height:100%}
.list{border-top:1px solid var(--ink);margin-top:4px}
.brow{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:.5px solid var(--hair);font-size:14px;padding-right:2px}
.brow .sw{width:9px;height:9px;flex-shrink:0;background:var(--c)}
.brow .lb{flex:1}
.brow small{font-size:12px;color:var(--ink2);margin-left:6px}
.brow b{font-family:var(--num);font-weight:500;font-size:15px;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.brow.muted b{font-family:var(--sans);font-size:13px;color:var(--ink2);font-weight:400}
.foot{font-size:12px;color:var(--ink2);margin:10px 2px 0;line-height:1.6}

#floatPanel{position:fixed;top:12px;right:12px;z-index:1001;width:300px;max-height:calc(100% - 130px);display:flex;flex-direction:column;border-radius:18px;overflow:hidden}
#fpHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 8px 16px;border-bottom:.5px solid var(--hair)}
#fpToggle{display:flex;align-items:center;gap:5px;border:0;background:none;padding:0;font:700 14px var(--serif);letter-spacing:.12em;color:var(--ink);cursor:pointer}
.chev{width:13px;height:13px;color:var(--ink3);transition:transform .45s var(--spring)}
#fpReset{border:0;font-size:12.5px;color:var(--accent);background:none;padding:2px 0;cursor:pointer;letter-spacing:.06em}
#fpReset:active{opacity:.5}
#fpList{padding:4px 6px 6px;overflow-y:auto;scrollbar-width:none}
#fpList::-webkit-scrollbar{display:none}
.fpRow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;outline:none;transition:background-color .2s ease}
.fpRow:hover{background-color:var(--fill)}
.fpRow:focus-visible{box-shadow:inset 0 0 0 2px var(--c)}
.fpRow.on{background-color:var(--fill)}
.fpLine{width:18px;height:0;border-top:3px solid var(--c);flex-shrink:0}
.fpLine.dash{border-top-style:dashed}
.fpLine.rail{border-top:3px dotted var(--c)}
.fpTag{width:40px;flex-shrink:0;font-family:var(--num);font-size:13px;color:var(--c);white-space:nowrap}
.fpTxt{min-width:0;display:flex;flex-direction:column}
.fpMain{font-size:13px;line-height:1.3}
.fpRow.on .fpMain{font-weight:600}
.fpMeta{font-size:11.5px;color:var(--ink2);line-height:1.3;margin-top:1px}
#floatPanel.collapsed #fpList{display:none}
#floatPanel.collapsed #fpHead{border-bottom:0;padding:8px 12px 8px 14px}
#floatPanel.collapsed .chev{transform:rotate(-90deg)}
#floatPanel.collapsed{width:auto}

.leaflet-container{background:var(--bg);font-family:var(--sans)}
.leaflet-right .leaflet-control{margin-right:12px}.leaflet-bottom .leaflet-control{margin-bottom:12px}
.leaflet-control-zoom{border:0!important;border-radius:10px!important;overflow:hidden;background-color:var(--paper)!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)!important}
.leaflet-control-zoom a{width:36px!important;height:36px!important;background:transparent!important;color:var(--ink)!important;border-bottom:.5px solid var(--hair)!important;font:300 20px/36px var(--sans)!important}
.leaflet-control-zoom a:last-child{border-bottom:0!important}
.leaflet-control-zoom a:hover{background:var(--fill)!important}
.leaflet-control-attribution{background:var(--paper)!important;border-radius:4px;font-size:10px;color:var(--ink2)!important}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-popup-content-wrapper{background:var(--paper-strong);border:.5px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);color:var(--ink)}
.leaflet-popup-tip{background:var(--paper-strong);box-shadow:none}
.leaflet-popup-content{margin:13px 15px 12px;font-family:var(--sans)}
.leaflet-container a.leaflet-popup-close-button{top:7px;right:7px;width:22px;height:22px;color:var(--ink3);font:400 18px/22px var(--sans);text-align:center}
.pin .d{font-size:11px;letter-spacing:.12em;color:var(--ink2)}
.pin b{display:block;font:700 15.5px/1.35 var(--serif);letter-spacing:.02em;margin:4px 20px 0 0}
.pin p{margin:6px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.leaflet-tooltip.tip{background:var(--paper-strong);border:.5px solid var(--hair);border-radius:6px;box-shadow:0 4px 14px rgba(60,40,20,.14);color:var(--ink);font:12px/1.35 var(--sans);padding:5px 8px}
.leaflet-tooltip.tip:before{display:none}
.mkWrap{background:none;border:0}
.mk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:22px;padding:0 8px;border-radius:3px;display:flex;align-items:center;white-space:nowrap;font:700 12px/1 var(--serif);letter-spacing:.06em;color:var(--pin-fg);background:var(--pin-bg);box-shadow:0 2px 6px rgba(40,25,10,.25);transition:transform .35s var(--spring)}
.mk.poi{color:var(--ink);background:var(--poi-bg);font-weight:400;font-family:var(--sans);font-size:11.5px;letter-spacing:0;border:.5px solid var(--hair);box-shadow:0 1px 4px rgba(40,25,10,.14)}
.mkWrap:hover .mk{transform:translate(-50%,-50%) scale(1.06)}

}
