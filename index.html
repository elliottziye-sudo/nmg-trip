<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="light dark"/>
<meta name="robots" content="noindex,nofollow"/>
<title>国庆内蒙古自驾 · 峡谷 · 乌海 · 康巴什</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
 --accent:#007AFF;--accent-tint:rgba(0,122,255,.12);
 --label:#000;--label2:rgba(60,60,67,.64);--label3:rgba(60,60,67,.34);--hair:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);
 --glass:rgba(248,248,250,.64);--glass-strong:rgba(255,255,255,.76);--glass-edge:rgba(255,255,255,.62);--group:rgba(255,255,255,.58);
 --sheen:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 38%);--hi:inset 0 1px 0 rgba(255,255,255,.7);
 --shadow:0 20px 56px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.06);
 --blur:saturate(180%) blur(30px);
 --spring:cubic-bezier(.32,.72,0,1);
 --bg:#E9EAEC;--mk-border:#fff;--poi-bg:rgba(255,255,255,.86);
}
@media (prefers-color-scheme:dark){:root{
 --accent:#0A84FF;--accent-tint:rgba(10,132,255,.22);
 --label:#fff;--label2:rgba(235,235,245,.64);--label3:rgba(235,235,245,.3);--hair:rgba(84,84,88,.55);--fill:rgba(118,118,128,.26);
 --glass:rgba(30,30,32,.6);--glass-strong:rgba(44,44,46,.78);--glass-edge:rgba(255,255,255,.1);--group:rgba(72,72,74,.42);
 --sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%);--hi:inset 0 1px 0 rgba(255,255,255,.08);
 --shadow:0 20px 56px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);--bg:#1C1C1E;--mk-border:#1C1C1E;--poi-bg:rgba(44,44,46,.88)}
 .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.86) saturate(.6)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--label);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font-family:inherit}
.glass{background-color:var(--glass);background-image:var(--sheen);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid var(--glass-edge);box-shadow:var(--shadow),var(--hi)}
#mapwrap{position:fixed;inset:0;z-index:0}
#map{position:absolute;inset:0}

/* Floating glass sidebar */
#side{position:fixed;top:12px;left:12px;bottom:12px;width:384px;z-index:1001;border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
#grab{display:none}
#sideScroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 16px 18px}
#sideScroll::-webkit-scrollbar{display:none}
#appbar{position:sticky;top:0;z-index:5;height:50px;margin:0 -16px -50px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;letter-spacing:-.01em;opacity:0;pointer-events:none;transition:opacity .3s var(--spring);background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:.5px solid var(--hair)}
#appbar.show{opacity:1}
#hdr{padding:42px 4px 0}
.cap{font-size:13px;font-weight:600;color:var(--label2)}
h1{font-size:32px;font-weight:700;letter-spacing:-.028em;line-height:1.12;margin:5px 0 7px}
.sub{font-size:13px;color:var(--label2);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:var(--group);border:.5px solid var(--glass-edge);border-radius:18px;padding:11px 12px 12px}
.stat .k{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--c)}
.stat .k svg{width:14px;height:14px}
.stat b{display:block;font-family:var(--round);font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:7px;line-height:1}
.stat b small{font-family:var(--font);font-size:12px;font-weight:600;color:var(--label2);margin-left:2px;letter-spacing:0}

/* Segmented control */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;margin:20px 0 14px}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:8px;background:var(--glass-strong);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .45s var(--spring)}
.seg[data-i="1"] .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:transparent;font-size:13px;font-weight:500;color:var(--label);padding:7px 0;cursor:pointer;border-radius:8px}
.seg button.on{font-weight:600}
.pane{animation:paneIn .45s var(--spring)}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Day groups */
.day{background:var(--group);border:.5px solid var(--glass-edge);border-radius:20px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:transform .45s var(--spring),background-color .25s ease;-webkit-tap-highlight-color:transparent;outline:none}
.day:hover{background-color:var(--glass-strong)}
.day:active{transform:scale(.975)}
.day:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.day.active{background-color:var(--accent-tint);border-color:transparent}
.day.active h3{color:var(--accent)}
.day .top{display:flex;align-items:center;gap:12px;padding:14px 14px 0}
.badge{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff;font:700 17px/1 var(--round);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.ttl{flex:1;min-width:0}
.day h3{font-size:16px;font-weight:600;margin:0 0 2px;letter-spacing:-.015em;line-height:1.3;transition:color .2s}
.day .rt{font-size:12.5px;color:var(--label2);line-height:1.42}
.day .body{padding:10px 14px 12px 64px}
.day .drive{display:inline-block;font-size:12px;font-weight:500;color:var(--label2);background:var(--fill);padding:4px 10px;border-radius:999px}
.day ul{margin:8px 0 0;padding:0;list-style:none}
.day li{font-size:13.5px;color:var(--label);line-height:1.5;margin-top:4px;position:relative;padding-left:12px}
.day li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--c)}
.day .htl{display:flex;align-items:center;gap:10px;margin-left:64px;padding:11px 14px 12px 0;border-top:.5px solid var(--hair);font-size:13px}
.htl .hi{color:#AF52DE;display:flex}.htl .hi svg{width:17px;height:17px}
.htl .hn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htl .hp{color:var(--label2);font-feature-settings:"tnum";white-space:nowrap}
.cta{display:block;width:100%;height:48px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;letter-spacing:-.01em;cursor:pointer;margin:6px 0 12px;transition:transform .45s var(--spring),filter .2s}
.cta:hover{filter:brightness(1.06)}.cta:active{transform:scale(.97)}
.tip{font-size:12.5px;color:var(--label2);line-height:1.65;padding:0 4px}

/* Budget */
.bcard{background:var(--group);border:.5px solid var(--glass-edge);border-radius:20px;padding:15px 16px 14px}
.bhd{font-size:13px;color:var(--label2);font-weight:500}
.btot{font-family:var(--round);font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-top:3px}
.btot span{font-family:var(--font);font-size:13px;font-weight:500;color:var(--label2);margin-left:6px;letter-spacing:0}
.bbar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin-top:14px}
.bbar i{display:block;height:100%}
.sh{font-size:13px;color:var(--label2);margin:20px 16px 7px;font-weight:500}
.list{background:var(--group);border:.5px solid var(--glass-edge);border-radius:20px;padding-left:14px;overflow:hidden}
.brow{display:flex;align-items:center;gap:12px;min-height:48px}
.brow .ico{width:29px;height:29px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff}
.brow .ico svg{width:17px;height:17px}
.brow .lb{flex:1;align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:15px;border-bottom:.5px solid var(--hair);font-size:15px}
.brow:last-child .lb{border-bottom:0}
.brow .lb b{font-weight:400;color:var(--label2);font-feature-settings:"tnum";white-space:nowrap}
.brow.free .lb b{color:#34C759;font-weight:600}
.foot{font-size:12px;color:var(--label2);margin:8px 16px 0;line-height:1.6}

/* Floating route list */
#floatPanel{position:fixed;top:12px;right:12px;z-index:1001;width:304px;max-height:calc(100% - 130px);display:flex;flex-direction:column;border-radius:24px;overflow:hidden}
#fpHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 12px 9px 18px}
#fpToggle{display:flex;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:17px;font-weight:600;letter-spacing:-.015em;color:var(--label);cursor:pointer}
.chev{width:15px;height:15px;color:var(--label3);transition:transform .45s var(--spring)}
#fpReset{border:0;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-tint);border-radius:999px;padding:6px 13px;cursor:pointer;transition:transform .45s var(--spring)}
#fpReset:active{transform:scale(.93)}
#fpList{padding:0 8px 8px;overflow-y:auto;scrollbar-width:none}
#fpList::-webkit-scrollbar{display:none}
.fpRow{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:13px;cursor:pointer;outline:none;transition:background-color .2s ease,transform .45s var(--spring)}
.fpRow:hover{background-color:var(--fill)}
.fpRow:active{transform:scale(.97)}
.fpRow:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.fpRow.on{background-color:var(--accent)}
.fpTag{min-width:38px;height:24px;padding:0 6px;border-radius:7px;flex-shrink:0;background:var(--c);color:#fff;font:600 12px/24px var(--round);text-align:center;white-space:nowrap}
.fpRow.on .fpTag{background:rgba(255,255,255,.26)}
.fpTxt{min-width:0;display:flex;flex-direction:column}
.fpMain{font-size:14px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.fpMeta{font-size:12px;color:var(--label2);line-height:1.3;margin-top:1px}
.fpRow.on .fpMain,.fpRow.on .fpMeta{color:#fff}
#floatPanel.collapsed #fpList{display:none}
#floatPanel.collapsed .chev{transform:rotate(-90deg)}
#floatPanel.collapsed{width:auto}
#floatPanel.collapsed #fpHead{padding:8px 8px 8px 16px}

/* Leaflet, glassed */
.leaflet-container{background:var(--bg);font-family:var(--font)}
.leaflet-right .leaflet-control{margin-right:12px}.leaflet-bottom .leaflet-control{margin-bottom:12px}
.leaflet-control-zoom{border:0!important;border-radius:14px!important;overflow:hidden;background-color:var(--glass)!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)!important}
.leaflet-control-zoom a{width:42px!important;height:42px!important;background:transparent!important;color:var(--label)!important;border-bottom:.5px solid var(--hair)!important;font:300 24px/42px var(--font)!important}
.leaflet-control-zoom a:last-child{border-bottom:0!important}
.leaflet-control-zoom a:hover{background:var(--fill)!important}
.leaflet-control-attribution{background:var(--glass)!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:8px;font-size:10px;color:var(--label2)!important}
.leaflet-control-attribution a{color:var(--label2)!important}
.leaflet-popup-content-wrapper{background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid var(--glass-edge);border-radius:20px;box-shadow:var(--shadow);color:var(--label)}
.leaflet-popup-tip{background:var(--glass-strong);box-shadow:none}
.leaflet-popup-content{margin:14px 16px 13px}
.leaflet-container a.leaflet-popup-close-button{top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--fill);color:var(--label2);font:600 15px/24px var(--font);text-align:center}
.pin{font-size:13px}
.pin .d{font-size:12px;font-weight:600;color:var(--accent)}
.pin b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em;margin:3px 24px 0 0;line-height:1.3}
.pin p{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--label2)}
.leaflet-tooltip.glassTip{background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid var(--glass-edge);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.15);color:var(--label);font:500 12px/1.3 var(--font);padding:5px 9px}
.leaflet-tooltip.glassTip:before{display:none}
.mkWrap{background:none;border:0}
.mk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:26px;padding:0 9px;border-radius:13px;display:flex;align-items:center;white-space:nowrap;font:600 12px/1 var(--font);color:#fff;background:var(--accent);border:2px solid var(--mk-border);box-shadow:0 4px 12px rgba(0,0,0,.26);transition:transform .45s var(--spring)}
.mk.poi{color:var(--accent);background:var(--poi-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:.5px solid var(--hair);font-size:11.5px}
.mkWrap:hover .mk{transform:translate(-50%,-50%) scale(1.1)}

@media (min-width:761px) and (max-width:1180px){
 #side{width:340px}
 #floatPanel{width:236px}
 .fpMeta{display:none}.fpMain{font-size:13px}
}
/* iPhone: full-bleed map + draggable sheet */
@media (max-width:760px){
 #side{top:auto;left:0;right:0;bottom:0;width:auto;height:calc(100dvh - 64px);border-radius:26px 26px 0 0;border-bottom:0;will-change:transform}
 #grab{display:flex;justify-content:center;align-items:center;height:22px;flex-shrink:0;touch-action:none;cursor:grab}
 #grab span{width:36px;height:5px;border-radius:3px;background:var(--label3)}
 #hdr{padding-top:4px;touch-action:none}
 #sideScroll{padding:0 14px calc(18px + env(safe-area-inset-bottom))}
 #appbar{margin:0 -14px -50px}
 h1{font-size:28px}
 .stat b{font-size:22px}
 #floatPanel{top:calc(10px + env(safe-area-inset-top));right:10px;width:244px;max-height:44vh;border-radius:20px}
 .fpMeta{display:none}
 .leaflet-control-zoom{display:none}
 .leaflet-bottom.leaflet-right{top:calc(10px + env(safe-area-inset-top));bottom:auto;left:10px;right:auto}
 .leaflet-bottom.leaflet-right .leaflet-control{margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="mapwrap"><div id="map"></div></div>
<aside id="side" class="glass">
 <div id="grab" title="拖动或点按调整面板"><span></span></div>
 <div id="sideScroll">
  <div id="appbar"><span id="abTitle"></span></div>
  <header id="hdr">
   <div class="cap">国庆自驾 · 10.1 – 10.6 · 2 人</div>
   <h1 id="ptitle"></h1>
   <div class="sub" id="psub"></div>
   <div class="stats">
    <div class="stat" style="--c:#007AFF"><div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>天数</div><b>6<small>天</small></b></div>
    <div class="stat" style="--c:#34C759"><div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8.4 18h6.6a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.6"/></svg>里程</div><b><span id="pkm"></span><small>km</small></b></div>
    <div class="stat" style="--c:#FF9500"><div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>驾驶</div><b id="phr"></b></div>
   </div>
  </header>
  <div class="seg" id="seg" data-i="0" role="tablist"><span class="thumb"></span><button class="on" role="tab" aria-selected="true">行程</button><button role="tab" aria-selected="false">预算</button></div>
  <section id="paneDays" class="pane">
   <div id="dayList"></div>
   <button class="cta" onclick="resetHighlight()">查看全程路线</button>
   <div class="tip">点行程或右上角路线列表可单独高亮某一段，按 Esc 回到全程。<br><span id="pnote"></span></div>
  </section>
  <section id="paneBudget" class="pane" hidden>
   <div class="bcard">
    <div class="bhd">2 人 · 6 天 · 国庆</div>
    <div class="btot">≈ ¥10,000<span>人均 ~¥5,000</span></div>
    <div class="bbar"><i style="flex:32.0;background:#007AFF"></i><i style="flex:24.9;background:#FF9500"></i><i style="flex:21.7;background:#AF52DE"></i><i style="flex:9.2;background:#30B0C7"></i><i style="flex:6.1;background:#FF2D55"></i><i style="flex:6.0;background:#34C759"></i></div>
   </div>
   <div class="sh">明细</div>
   <div class="list">
    <div class="brow" style="--c:#007AFF"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5V12l2.2-5h11.6L20 12v4.5z"/><path d="M6 16.5V19M18 16.5V19M4 12h16"/></svg></span><span class="lb">租车 · 问界M7增程<b>¥3,212</b></span></div>
    <div class="brow" style="--c:#FF9500"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M4.5 3v5a2.5 2.5 0 0 0 5 0V3M17 21V3c-2.2 1.2-3.2 3.3-3.2 6.2V13H17"/></svg></span><span class="lb">餐饮 · 吃饭+零食<b>¥2,500</b></span></div>
    <div class="brow" style="--c:#AF52DE"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18.5V6.5M3 14h18v4.5M21 14v-2.2A2.8 2.8 0 0 0 18.2 9H11v5"/><circle cx="7" cy="11" r="1.7"/></svg></span><span class="lb">酒店 5 晚 · 已订<b>¥2,176.6</b></span></div>
    <div class="brow" style="--c:#30B0C7"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="13.5" rx="3"/><path d="M6 10h12M9.5 19.5 7.5 21.5M14.5 19.5l2 2"/></svg></span><span class="lb">往返高铁 · 230×4<b>¥920</b></span></div>
    <div class="brow" style="--c:#FF2D55"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M14.5 7.5v1.5M14.5 11.25v1.5M14.5 15v1.5"/></svg></span><span class="lb">门票<b>¥616</b></span></div>
    <div class="brow" style="--c:#34C759"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 2.5 5 13.2h5.8l-1 8.3 8.2-10.7h-5.8z"/></svg></span><span class="lb">能源 · 电+油<b>~¥600</b></span></div>
    <div class="brow free" style="--c:#8E8E93"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4.5 21M16 3l3.5 18M12 5v2.5M12 11v2.5M12 17v2.5"/></svg></span><span class="lb">过路费<b>国庆免费</b></span></div>
   </div>
   <div class="foot">能源为估算；酒店为实付；高铁按每张 230 元计。</div>
  </section>
 </div>
</aside>

  const el=document.createElement('div');el.className='day';el.style.setProperty('--c',d.color);el.tabIndex=0;el.setAttribute('role','button');
  let htl='';
  if(d.hotel){const seg=d.hotel.split(' · ');let price='';if(seg.length>1&&seg[seg.length-1].indexOf('¥')>=0)price=seg.pop();
   htl='<div class="htl"><span class="hi">'+BED+'</span><span class="hn">'+seg.join(' · ')+'</span>'+(price?'<span class="hp">'+price+'</span>':'')+'</div>';}
  el.innerHTML='<div class="top"><div class="badge">'+d.n+'</div><div class="ttl"><h3>'+d.title+'</h3><div class="rt">'+d.route+'</div></div></div>'+
   '<div class="body"><span class="drive">'+d.drive+'</span><ul>'+d.acts.map(a=>'<li>'+a+'</li>').join('')+'</ul></div>'+htl;
  el.dataset.leg=d.focusLeg;el.dataset.stop=d.focusStop;
  const act=()=>{
   if(d.focusLeg>=0){highlightLeg(d.focusLeg);return;}
   collapseSheetForMap();resetHighlight(true);el.classList.add('active');
   const mk=curMarkers[d.focusStop];if(mk){map.closePopup();moveTo(mk.getLatLng().toBounds(60000),60);clearTimeout(window._pt);window._pt=setTimeout(()=>mk.openPopup(),RM?0:900);}
  };
  el.onclick=act;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}};
  list.appendChild(el);
 });
 document.getElementById('sideScroll').scrollTop=0;
}
function buildFloat(p){
 const list=document.getElementById('fpList');list.innerHTML='';
 p.legs.forEach(function(l,i){
  const parts=l.label.split(' · ');let tag=parts[0].trim();const rest=parts.slice(1);
  if(l.rail){tag='高铁';rest.push(parts[0].replace('🚄','').trim());}
  const main=rest.shift()||'';const meta=rest.join(' · ');
  const row=document.createElement('div');row.className='fpRow';row.style.setProperty('--c',l.color);row.tabIndex=0;row.setAttribute('role','button');
  row.innerHTML='<span class="fpTag">'+tag+'</span><span class="fpTxt"><span class="fpMain">'+main+'</span>'+(meta?'<span class="fpMeta">'+meta+'</span>':'')+'</span>';
  row.onclick=function(){if(MQ.matches)document.getElementById('floatPanel').classList.add('collapsed');highlightLeg(i);};
  row.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();row.onclick();}};
  list.appendChild(row);
  if(curLegs[i])curLegs[i].on('click',function(){highlightLeg(i);});
 });
}
function highlightLeg(i){
 collapseSheetForMap();
 document.querySelectorAll('.fpRow').forEach((r,j)=>r.classList.toggle('on',j===i));
 document.querySelectorAll('.day').forEach(x=>x.classList.toggle('active',x.dataset.leg===String(i)));
 curLegs.forEach((pl,j)=>{if(!pl)return;const bs=baseStyle(PLANS[curPlan].legs[j]);pl.setStyle({opacity:j===i?1:0.16,weight:j===i?bs.weight+1:Math.max(2,bs.weight-3)});if(j===i)pl.bringToFront();});
 map.closePopup();refreshPopupPad();
 if(curLegs[i]){try{map.invalidateSize();moveTo(curLegs[i].getBounds(),60);}catch(e){}}
 const dL=PLANS[curPlan].legs[i];const di=(dL&&dL.dest!=null)?dL.dest:i+1;
 clearTimeout(window._pt);window._pt=setTimeout(()=>{if(curMarkers[di])curMarkers[di].openPopup();},RM?0:900);
 const a=document.querySelector('.day.active');if(a&&!MQ.matches&&a.offsetParent)a.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
}
function resetHighlight(skipFit){
 clearTimeout(window._pt);
 document.querySelectorAll('.fpRow').forEach(r=>r.classList.remove('on'));
 document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));
 curLegs.forEach((pl,j)=>{if(!pl)return;const bs=baseStyle(PLANS[curPlan].legs[j]);pl.setStyle({opacity:bs.opacity,weight:bs.weight});});
 map.closePopup();
 if(skipFit!==true){collapseSheetForMap();fitCur(true);}
}
/* iOS-style draggable sheet (phone) */
(function(){
 const sd=document.getElementById('side'),sc=document.getElementById('sideScroll'),grab=document.getElementById('grab'),hd=document.getElementById('hdr');
 let y0=0,t0=0,startTy=0,drag=false,moved=false;
 const H=()=>sd.offsetHeight;
 const stops=()=>{const h=H(),vh=window.innerHeight;return[Math.max(0,h-150),Math.max(0,h-Math.round(vh*0.48)),0];};
 const cur=()=>{const m=/translateY\((-?[\d.]+)px\)/.exec(sd.style.transform);return m?+m[1]:0;};
 const setTy=(ty,anim)=>{sd.style.transition=(anim&&!RM)?'transform .5s cubic-bezier(.32,.72,0,1)':'none';sd.style.transform='translateY('+ty+'px)';};
 function snap(k){if(!MQ.matches)return;window.sheetDet=Math.max(0,Math.min(2,k));const ty=stops()[window.sheetDet];window.sheetVisiblePx=H()-ty;setTy(ty,true);refreshPopupPad();}
 window.sheetSnap=snap;
 function down(e){if(!MQ.matches)return;if(!e.target.closest('#grab')&&sc.scrollTop>2)return;drag=true;moved=false;y0=e.clientY;t0=performance.now();startTy=cur();setTy(startTy,false);try{sd.setPointerCapture(e.pointerId);}catch(_){}}
 function move(e){if(!drag)return;const dy=e.clientY-y0;if(Math.abs(dy)>5)moved=true;let ty=startTy+dy;const s=stops();if(ty<0)ty*=0.2;else if(ty>s[0])ty=s[0]+(ty-s[0])*0.2;setTy(ty,false);}
 function up(e){if(!drag)return;drag=false;
  if(!moved){if(e.target.closest('#grab'))snap(window.sheetDet===2?0:window.sheetDet+1);else setTy(stops()[window.sheetDet],true);return;}
  const v=(e.clientY-y0)/Math.max(performance.now()-t0,1),s=stops(),ty=cur();
  let best=0;s.forEach((p,k)=>{if(Math.abs(p-ty)<Math.abs(s[best]-ty))best=k;});
  if(v>0.45)snap(Math.max(0,window.sheetDet-1));else if(v<-0.45)snap(Math.min(2,window.sheetDet+1));else snap(best);
 }
 grab.addEventListener('pointerdown',down);hd.addEventListener('pointerdown',down);
 sd.addEventListener('pointermove',move);sd.addEventListener('pointerup',up);sd.addEventListener('pointercancel',up);
 function apply(){if(MQ.matches){snap(window.sheetDet);}else{sd.style.transform='';sd.style.transition='';window.sheetVisiblePx=0;}}
 if(MQ.addEventListener)MQ.addEventListener('change',apply);else MQ.addListener(apply);
 window.addEventListener('resize',()=>{if(MQ.matches){const ty=stops()[window.sheetDet];window.sheetVisiblePx=H()-ty;setTy(ty,false);}});
 apply();
})();
